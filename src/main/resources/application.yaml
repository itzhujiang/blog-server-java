server:
  port: 8089
  forward-headers-strategy: framework
  servlet:
    context-path: /api
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:blog}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
#  sql:
#    init:
#      mode: always
#      platform: postgresql
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true  # 已有数据库时从基线开始，第一次迁移必须加
  application:
    name: blog-server-java
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

app:
  cors-origin: "*"
  uploads-dir: ${user.dir}/uploads
  uploads-url: /uploads   # URL前缀
  jwt-secret: ${JWT_SECRET:lingyu-2026-lingyu-2026-lingyu-999999999}
  jwt-expire: 604800
mybatis-plus:
  global-config:
    db-config:
      logic-not-delete-value: 0
      logic-delete-value: 1
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler